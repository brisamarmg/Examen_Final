<div class="netflix-login-bg">
  <header class="netflix-header">
    <h1 class="logo">RICKFLIX</h1>
  </header>

  <div class="login-box">
    <h2>Iniciar sesión</h2>
    <form (ngSubmit)="iniciarSesion()">
      <input type="text" [(ngModel)]="usuario" name="usuario" placeholder="Correo o carnet UMG" required />
      <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required />
      <p class="error" *ngIf="error">{{ error }}</p>
      <button type="submit" class="btn-netflix">Iniciar sesión</button>
    </form>
  </div>
</div>
