<div class="detail-container" *ngIf="personaje">
  <button class="btn-back" (click)="volver()">&larr; Volver al catálogo</button>

  <div class="detail-card">
    <img [src]="personaje.image" [alt]="personaje.name" />
    <div class="detail-info">
      <h1>{{ personaje.name }}</h1>
      <p><strong>Estado:</strong> {{ personaje.status }}</p>
      <p><strong>Especie:</strong> {{ personaje.species }}</p>
      <p><strong>Género:</strong> {{ personaje.gender }}</p>
      <p><strong>Origen:</strong> {{ personaje.origin?.name }}</p>
      <p><strong>Ubicación actual:</strong> {{ personaje.location?.name }}</p>

      <h3>Episodios donde aparece (clic para ver detalle del episodio):</h3>
      <div class="episodes-chips">
        <button
          class="chip"
          *ngFor="let epUrl of personaje.episode"
          (click)="irAEpisodio(epUrl)">
          Episodio #{{ epUrl.split('/').pop() }}
        </button>
      </div>
    </div>
  </div>
</div>
